name: scalable-event-driven-processing

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hpt
      POSTGRES_USER: hpt
      POSTGRES_PASSWORD: scalable-event-driven-processing-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpt -d hpt"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic basket.commands --partitions 4 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.submitted --partitions 4 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.inventory-results --partitions 4 --replication-factor 1

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: src/ScalableEventDrivenProcessing.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Kafka__BootstrapServers: kafka:9092
      Redis__ConnectionString: redis:6379
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=hpt;Username=hpt;Password=scalable-event-driven-processing-dev-only
      Web__Origin: http://localhost:8081
    ports:
      - "5080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  basket-processor:
    build:
      context: .
      dockerfile: src/ScalableEventDrivenProcessing.BasketProcessor/Dockerfile
    environment:
      Kafka__BootstrapServers: kafka:9092
      Redis__ConnectionString: redis:6379
      Basket__TtlSeconds: 86400
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  inventory-processor:
    build:
      context: .
      dockerfile: src/ScalableEventDrivenProcessing.InventoryProcessor/Dockerfile
    environment:
      Kafka__BootstrapServers: kafka:9092
      Redis__ConnectionString: redis:6379
      Basket__TtlSeconds: 86400
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=hpt;Username=hpt;Password=scalable-event-driven-processing-dev-only
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  redis-data:
