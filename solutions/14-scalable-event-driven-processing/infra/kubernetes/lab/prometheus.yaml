apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalable-event-driven-processing-prometheus
  namespace: scalable-event-driven-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalable-event-driven-processing-prometheus
  template:
    metadata:
      labels:
        app: scalable-event-driven-processing-prometheus
    spec:
      serviceAccountName: scalable-event-driven-processing-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: alerts
              mountPath: /etc/prometheus-alerts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: scalable-event-driven-processing-prometheus-config
        - name: alerts
          configMap:
            name: scalable-event-driven-processing-prometheus-alerts

---
apiVersion: v1
kind: Service
metadata:
  name: scalable-event-driven-processing-prometheus
  namespace: scalable-event-driven-processing
spec:
  selector:
    app: scalable-event-driven-processing-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
