apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalable-event-driven-processing-prometheus
  namespace: scalable-event-driven-processing

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalable-event-driven-processing-prometheus-discovery
  namespace: scalable-event-driven-processing
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalable-event-driven-processing-prometheus-discovery
  namespace: scalable-event-driven-processing
subjects:
  - kind: ServiceAccount
    name: scalable-event-driven-processing-prometheus
    namespace: scalable-event-driven-processing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scalable-event-driven-processing-prometheus-discovery
