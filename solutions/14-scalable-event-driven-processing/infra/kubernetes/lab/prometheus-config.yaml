apiVersion: v1
kind: ConfigMap
metadata:
  name: scalable-event-driven-processing-prometheus-config
  namespace: scalable-event-driven-processing
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus-alerts/alerts.yml
    scrape_configs:
      - job_name: scalable-event-driven-processing-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [scalable-event-driven-processing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: scalable-event-driven-processing-basket-processor
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [scalable-event-driven-processing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: scalable-event-driven-processing-basket-processor
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: scalable-event-driven-processing-inventory-processor
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [scalable-event-driven-processing]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: scalable-event-driven-processing-inventory-processor
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: scalable-event-driven-processing-kafka
        static_configs:
          - targets: [scalable-event-driven-processing-kafka-exporter.scalable-event-driven-processing.svc.cluster.local:9404]
      - job_name: scalable-event-driven-processing-postgres
        static_configs:
          - targets: [scalable-event-driven-processing-postgres-exporter.scalable-event-driven-processing.svc.cluster.local:9187]
      - job_name: scalable-event-driven-processing-redis
        static_configs:
          - targets: [scalable-event-driven-processing-redis-exporter.scalable-event-driven-processing.svc.cluster.local:9121]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalable-event-driven-processing-prometheus-alerts
  namespace: scalable-event-driven-processing
data:
  alerts.yml: |
    groups:
      - name: hpt.recording
        interval: 30s
        rules:
          - record: hpt:api_rps:rate5m
            expr: sum(rate(http_server_request_duration_seconds_count{job="scalable-event-driven-processing-api"}[5m]))
          - record: hpt:api_latency_p95_seconds:5m
            expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="scalable-event-driven-processing-api"}[5m])))
          - record: hpt:kafka_consumer_lag:sum
            expr: sum(kafka_consumergroup_lag)
          - record: hpt:basket_accepted_rps:rate5m
            expr: sum(rate(hpt_basket_commands_total[5m]))
          - record: hpt:basket_processed_rps:rate5m
            expr: sum(rate(hpt_basket_events_processed_total[5m]))
      - name: hpt.alerts
        rules:
          - alert: HptScrapeTargetDown
            expr: up{job=~"scalable-event-driven-processing-.*"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HPT scrape target is down"
              description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."
          - alert: HptKafkaConsumerLagHigh
            expr: sum(kafka_consumergroup_lag) > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT Kafka consumer lag is high"
              description: "Consumer lag has stayed above 10000 messages for five minutes."
          - alert: HptBasketProcessingBehind
            expr: hpt:basket_accepted_rps:rate5m > (hpt:basket_processed_rps:rate5m or vector(0)) and hpt:kafka_consumer_lag:sum > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT basket processing is behind ingestion"
              description: "Accepted command rate exceeds processed rate while Kafka lag is above 1000 messages."
          - alert: HptKafkaBatchPublishFailures
            expr: increase(hpt_kafka_publish_failures_total[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "HPT batch producer delivery failed"
              description: "At least one Kafka record in a batch failed delivery during the last five minutes."
          - alert: HptBatchAdmissionPressure
            expr: sum(rate(hpt_basket_batch_rejections_total[5m])) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HPT batch admission is rejecting sustained load"
              description: "The batch concurrency limit is rejecting more than 0.1 requests per second on average."
          - alert: HptApiP95LatencyHigh
            expr: hpt:api_latency_p95_seconds:5m > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT API p95 latency is high"
              description: "API p95 latency has stayed above 500ms for five minutes."
