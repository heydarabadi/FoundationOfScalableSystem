apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpt-api
  namespace: hpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpt-api
  minReplicas: 12
  maxReplicas: 256
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
