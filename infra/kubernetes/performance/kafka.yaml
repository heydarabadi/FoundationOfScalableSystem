apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: hpt-controllers
  namespace: hpt
  labels:
    strimzi.io/cluster: hpt-kafka
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 20Gi
    deleteClaim: false
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: hpt-brokers
  namespace: hpt
  labels:
    strimzi.io/cluster: hpt-kafka
spec:
  replicas: 12
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 500Gi
    deleteClaim: false
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: hpt-kafka
  namespace: hpt
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.2
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 4
      min.insync.replicas: 3
      log.retention.hours: 72
  entityOperator:
    topicOperator: {}
    userOperator: {}
