apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hpt-gateway
  namespace: hpt
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.hpt.local
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hpt-api-route
  namespace: hpt
spec:
  parentRefs:
    - name: hpt-gateway
      sectionName: http
  hostnames:
    - api.hpt.local
  rules:
    - backendRefs:
        - name: api
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: hpt-api-cpu-policy
  namespace: hpt
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hpt-api-route
  loadBalancer:
    type: BackendUtilization
    backendUtilization: {}
