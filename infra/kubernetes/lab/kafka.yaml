apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: hpt-kafka-nodes
  namespace: hpt
  labels:
    strimzi.io/cluster: hpt-kafka
spec:
  replicas: 4
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: hpt-kafka
  namespace: hpt
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.2
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 4
      min.insync.replicas: 3
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
