apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpt-prometheus
  namespace: hpt

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpt-prometheus-discovery
  namespace: hpt
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpt-prometheus-discovery
  namespace: hpt
subjects:
  - kind: ServiceAccount
    name: hpt-prometheus
    namespace: hpt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hpt-prometheus-discovery
