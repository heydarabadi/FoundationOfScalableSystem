apiVersion: v1
kind: Service
metadata:
  name: hpt-postgres
  namespace: hpt
spec:
  selector:
    app: hpt-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hpt-postgres
  namespace: hpt
spec:
  serviceName: hpt-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hpt-postgres
  template:
    metadata:
      labels:
        app: hpt-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: hpt
            - name: POSTGRES_USER
              value: hpt
            - name: POSTGRES_PASSWORD
              value: hpt-dev-only
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U hpt -d hpt"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: hpt-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hpt-redis
  namespace: hpt
spec:
  selector:
    app: hpt-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hpt-redis-data
  namespace: hpt
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpt-redis
  namespace: hpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpt-redis
  template:
    metadata:
      labels:
        app: hpt-redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redisdata
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: redisdata
          persistentVolumeClaim:
            claimName: hpt-redis-data
