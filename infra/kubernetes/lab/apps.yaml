---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpt-api
  namespace: hpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpt-api
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpt-basket-processor
  namespace: hpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpt-basket-processor
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpt-web
  namespace: hpt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpt-web
  template:
    metadata:
      labels:
        app: hpt-web
    spec:
      containers:
        - name: web
          image: hpt-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hpt-web
  namespace: hpt
spec:
  selector:
    app: hpt-web
  ports:
    - port: 80
      targetPort: 80
