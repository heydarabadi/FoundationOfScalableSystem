apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpt-api
  namespace: hpt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpt-api
  template:
    metadata:
      labels:
        app: hpt-api
    spec:
      containers:
        - name: api
          image: hpt-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hpt-app-config
            - secretRef:
                name: hpt-app-secrets
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hpt
  labels:
    app: hpt-api
spec:
  selector:
    app: hpt-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpt-basket-processor
  namespace: hpt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpt-basket-processor
  template:
    metadata:
      labels:
        app: hpt-basket-processor
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: basket-processor
          image: hpt-basket-processor:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9464
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "9464"
          envFrom:
            - configMapRef:
                name: hpt-app-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hpt-basket-processor
  namespace: hpt
spec:
  selector:
    app: hpt-basket-processor
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
