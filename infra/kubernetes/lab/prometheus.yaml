apiVersion: v1
kind: ServiceAccount
metadata:
  name: hpt-prometheus
  namespace: hpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hpt-prometheus-discovery
  namespace: hpt
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hpt-prometheus-discovery
  namespace: hpt
subjects:
  - kind: ServiceAccount
    name: hpt-prometheus
    namespace: hpt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hpt-prometheus-discovery
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpt-prometheus-config
  namespace: hpt
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus-alerts/alerts.yml
    scrape_configs:
      - job_name: hpt-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [hpt]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: hpt-basket-processor
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [hpt]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: hpt-basket-processor
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: hpt-inventory-processor
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [hpt]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: hpt-inventory-processor
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: hpt-kafka
        static_configs:
          - targets: [hpt-kafka-exporter.hpt.svc.cluster.local:9404]
      - job_name: hpt-postgres
        static_configs:
          - targets: [hpt-postgres-exporter.hpt.svc.cluster.local:9187]
      - job_name: hpt-redis
        static_configs:
          - targets: [hpt-redis-exporter.hpt.svc.cluster.local:9121]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpt-prometheus-alerts
  namespace: hpt
data:
  alerts.yml: |
    groups:
      - name: hpt.recording
        interval: 30s
        rules:
          - record: hpt:api_rps:rate5m
            expr: sum(rate(http_server_request_duration_seconds_count{job="hpt-api"}[5m]))
          - record: hpt:api_latency_p95_seconds:5m
            expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="hpt-api"}[5m])))
          - record: hpt:kafka_consumer_lag:sum
            expr: sum(kafka_consumergroup_lag)
          - record: hpt:basket_accepted_rps:rate5m
            expr: sum(rate(hpt_basket_commands_total[5m]))
          - record: hpt:basket_processed_rps:rate5m
            expr: sum(rate(hpt_basket_events_processed_total[5m]))
      - name: hpt.alerts
        rules:
          - alert: HptScrapeTargetDown
            expr: up{job=~"hpt-.*"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HPT scrape target is down"
              description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."
          - alert: HptKafkaConsumerLagHigh
            expr: sum(kafka_consumergroup_lag) > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT Kafka consumer lag is high"
              description: "Consumer lag has stayed above 10000 messages for five minutes."
          - alert: HptBasketProcessingBehind
            expr: hpt:basket_accepted_rps:rate5m > (hpt:basket_processed_rps:rate5m or vector(0)) and hpt:kafka_consumer_lag:sum > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT basket processing is behind ingestion"
              description: "Accepted command rate exceeds processed rate while Kafka lag is above 1000 messages."
          - alert: HptKafkaBatchPublishFailures
            expr: increase(hpt_kafka_publish_failures_total[5m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "HPT batch producer delivery failed"
              description: "At least one Kafka record in a batch failed delivery during the last five minutes."
          - alert: HptBatchAdmissionPressure
            expr: sum(rate(hpt_basket_batch_rejections_total[5m])) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HPT batch admission is rejecting sustained load"
              description: "The batch concurrency limit is rejecting more than 0.1 requests per second on average."
          - alert: HptApiP95LatencyHigh
            expr: hpt:api_latency_p95_seconds:5m > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HPT API p95 latency is high"
              description: "API p95 latency has stayed above 500ms for five minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpt-prometheus
  namespace: hpt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpt-prometheus
  template:
    metadata:
      labels:
        app: hpt-prometheus
    spec:
      serviceAccountName: hpt-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: alerts
              mountPath: /etc/prometheus-alerts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: hpt-prometheus-config
        - name: alerts
          configMap:
            name: hpt-prometheus-alerts
---
apiVersion: v1
kind: Service
metadata:
  name: hpt-prometheus
  namespace: hpt
spec:
  selector:
    app: hpt-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
